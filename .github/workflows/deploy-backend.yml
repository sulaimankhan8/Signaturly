name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: project-9aac115a-73f9-4e8a-9a7
  REGION: us-central1
  SERVICE_NAME: signaturly-api
  REPOSITORY_NAME: signaturly-repo
  IMAGE_NAME: signaturly-api
  PROJECT_NUMBER: '774331940137'

# Required permissions for GitHub OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Nothing is deployed unless the test suite passes
    needs: test

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud (Keyless Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/774331940137/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-9aac115a-73f9-4e8a-9a7.iam.gserviceaccount.com'

      - name: ⚙️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🐳 Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏗️ Build Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}"
          docker build \
            -t "${IMAGE_TAG}:${{ github.sha }}" \
            -t "${IMAGE_TAG}:latest" \
            ./server

      - name: 🚀 Push Docker Image to Artifact Registry
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}"
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"

      - name: 🌐 Deploy to Google Cloud Run
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --set-env-vars="^@^NODE_ENV=production@STORAGE_PROVIDER=gcs@GCP_PROJECT_ID=${{ env.PROJECT_ID }}@GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}@GCS_SIGNED_URL_EXPIRES=900@SMTP_HOST=${{ vars.SMTP_HOST }}@SMTP_PORT=${{ vars.SMTP_PORT }}@SMTP_FROM=${{ vars.SMTP_FROM }}@CORS_ORIGIN=${{ vars.CORS_ORIGIN }}@APP_URL=${{ vars.APP_URL }}" \
            --set-secrets="MONGO_URI=MONGO_URI:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,ADMIN_SECRET_KEY=ADMIN_SECRET_KEY:latest,ADMIN_JWT_SECRET=ADMIN_JWT_SECRET:latest,AUDIT_HMAC_KEY=AUDIT_HMAC_KEY:latest,SEAL_P12_BASE64=SEAL_P12_BASE64:latest,SEAL_P12_PASSWORD=SEAL_P12_PASSWORD:latest,INTERNAL_JOB_SECRET=INTERNAL_JOB_SECRET:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest"
