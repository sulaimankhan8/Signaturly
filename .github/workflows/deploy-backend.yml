name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/scripts/cloud_run_settings.py'
  workflow_dispatch:

env:
  PROJECT_ID: project-9aac115a-73f9-4e8a-9a7
  REGION: us-central1
  SERVICE_NAME: signaturly-api
  REPOSITORY_NAME: signaturly-repo
  IMAGE_NAME: signaturly-api
  PROJECT_NUMBER: '774331940137'

# Required permissions for GitHub OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Nothing is deployed unless the test suite passes
    needs: test

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud (Keyless Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/774331940137/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-9aac115a-73f9-4e8a-9a7.iam.gserviceaccount.com'

      - name: ⚙️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🐳 Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏗️ Build Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}"
          docker build \
            -t "${IMAGE_TAG}:${{ github.sha }}" \
            -t "${IMAGE_TAG}:latest" \
            ./server

      - name: 🚀 Push Docker Image to Artifact Registry
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}"
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"

      # The plain settings go into a file and the secrets into a list. Optional ones, such as the
      # Razorpay keys, are included only when the repository has them: see the script.
      - name: 🧾 Collect the service's settings
        id: settings
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          APP_URL: ${{ vars.APP_URL }}
          API_URL: ${{ vars.API_URL }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          SELLER_LEGAL_NAME: ${{ vars.SELLER_LEGAL_NAME }}
          SELLER_ADDRESS: ${{ vars.SELLER_ADDRESS }}
          SELLER_GSTIN: ${{ vars.SELLER_GSTIN }}
          SELLER_STATE_CODE: ${{ vars.SELLER_STATE_CODE }}
          USAGE_CHARGING_ENABLED: ${{ vars.USAGE_CHARGING_ENABLED }}
          MESSAGING_ENABLED: ${{ vars.MESSAGING_ENABLED }}
          MESSAGING_PROVIDER: ${{ vars.MESSAGING_PROVIDER }}
          TEMPLATES_ALLOW_UNREVIEWED: ${{ vars.TEMPLATES_ALLOW_UNREVIEWED }}
          SIGNING_LINK_TTL_DAYS: ${{ vars.SIGNING_LINK_TTL_DAYS }}
          FILE_URL_TTL_SECONDS: ${{ vars.FILE_URL_TTL_SECONDS }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          OPTIONAL_SECRETS: ${{ vars.OPTIONAL_SECRETS }}
        run: |
          SECRETS="$(python3 .github/scripts/cloud_run_settings.py "$RUNNER_TEMP/settings.yaml")"
          echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"

      - name: 🌐 Deploy to Google Cloud Run
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --env-vars-file "$RUNNER_TEMP/settings.yaml" \
            --set-secrets="${{ steps.settings.outputs.secrets }}"
